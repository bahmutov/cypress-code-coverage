name: ci
on: push
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎
        # https://github.com/actions/checkout
        uses: actions/checkout@v7

      - name: Install dependencies 📦
        # https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v7
        with:
          runTests: false

      - name: Check types 🧾
        run: npm run types

      - name: Catch it.only 🫴
        run: npm run stop-only

      - name: Run tests 🧪
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm start

  test-merge-coverage:
    runs-on: ubuntu-24.04
    env:
      DEBUG: code-coverage
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Install dependencies 🧪
        # https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v7
        with:
          runTests: false

      - name: Merge coverage tests
        working-directory: examples/merge-coverage
        run: |
          npm run cy:run1
          npm run cy:run2
          npm run merge

  release:
    needs: [test, test-merge-coverage]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    # https://glebbahmutov.com/blog/npm-publish-from-github/
    permissions:
      # allow the release step to comment on
      # issues, pull requests, and write to the repo
      contents: write
      issues: write
      pull-requests: write
      # Required for OIDC to let NPM registry know
      # that this workflow is trusted
      id-token: write

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Install only the semantic release 📦
        run: npm install semantic-release

      - name: Semantic Release 🚀
        # https://github.com/cycjimmy/semantic-release-action
        uses: cycjimmy/semantic-release-action@v6
        with:
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
